<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小猪邵珠佳 · 聊天</title>
<style>
  :root {
    --bg: #fdf6f0;
    --panel: #fffdfb;
    --pink: #f6b7c6;
    --pink-deep: #e8889f;
    --pink-soft: #fde3ea;
    --ink: #4a3f43;
    --ink-soft: #8b7c82;
    --line: #f0e2e6;
    --shadow: 0 10px 30px rgba(214, 160, 175, .18);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 20% 0%, #fff3f6 0%, var(--bg) 55%, #f7eee8 100%);
    color: var(--ink);
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
  }

  /* ---------------- 左：小猪舞台 ---------------- */
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px 24px;
    background: linear-gradient(180deg, #fff8fa 0%, #fdf1f4 100%);
    border-right: 1px solid var(--line);
  }
  .pig-wrap { position: relative; width: 240px; height: 240px; }
  .pig { width: 100%; height: 100%; overflow: visible; animation: bob 3.6s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  .pig.talking { animation: bobTalk .5s ease-in-out infinite; }
  @keyframes bobTalk {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-5px) rotate(1deg); }
  }
  #eyeL, #eyeR { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%, 97% { transform: scaleY(.08); }
  }
  #mouth { opacity: 0; transition: opacity .15s; }
  .pig.talking #mouth { opacity: 1; }
  #tail { transform-box: fill-box; transform-origin: 10% 50%; animation: wag 1.8s ease-in-out infinite; }
  @keyframes wag {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(14deg); }
  }

  .name { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .name small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-soft); margin-top: 4px; letter-spacing: 0; }
  .affinity {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 12px; color: var(--ink-soft);
  }
  .hearts { display: flex; gap: 3px; }
  .hearts span { opacity: .22; transition: opacity .3s, transform .3s; }
  .hearts span.on { opacity: 1; transform: scale(1.08); }
  .mood {
    font-size: 12px; color: var(--pink-deep); background: var(--pink-soft);
    padding: 5px 12px; border-radius: 999px; min-height: 26px;
  }

  /* ---------------- 右：聊天 ---------------- */
  .chat { display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
  .chat-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
  }
  .chat-head h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .chat-head .hint { font-size: 12px; color: var(--ink-soft); }

  .log { flex: 1; overflow-y: auto; padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: #eed6dd; border-radius: 4px; }

  .row { display: flex; gap: 10px; align-items: flex-end; max-width: 78%; }
  .row.me { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: 0 0 34px;
    background: var(--pink-soft); display: grid; place-items: center; font-size: 18px;
    box-shadow: 0 2px 6px rgba(214,160,175,.25);
  }
  .bubble {
    padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.62;
    white-space: pre-wrap; word-break: break-word; box-shadow: 0 2px 8px rgba(214,160,175,.12);
  }
  .row.pig .bubble { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .row.me .bubble { background: linear-gradient(135deg, #f9c3d0, #f2a8bb); color: #4a2f37; border-bottom-right-radius: 5px; }
  .time { font-size: 11px; color: #b9a7ad; align-self: center; }

  .typing { display: flex; gap: 4px; padding: 12px 16px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--pink-deep);
    animation: dot 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes dot { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-4px); opacity: 1; } }

  .composer { display: flex; gap: 10px; padding: 14px 22px 18px; border-top: 1px solid var(--line); background: #fffdfb; }
  .composer textarea {
    flex: 1; resize: none; height: 46px; max-height: 120px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; font: inherit; font-size: 14px;
    background: #fffafc; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .composer textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(246,183,198,.22); }
  .btn {
    border: 0; cursor: pointer; font: inherit; font-size: 14px; border-radius: 12px;
    padding: 0 20px; color: #fff; background: linear-gradient(135deg, #f2a8bb, #e8889f);
    box-shadow: 0 6px 16px rgba(232,136,159,.3); transition: transform .08s, filter .15s;
  }
  .btn:hover { filter: brightness(1.04); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: #fff; color: var(--ink-soft); border: 1px solid var(--line); box-shadow: none;
    padding: 7px 13px; font-size: 12.5px;
  }
  .btn.ghost:hover { color: var(--pink-deep); border-color: var(--pink); }

  /* ---------------- 语录抽屉 ---------------- */
  .drawer {
    position: fixed; top: 0; right: 0; height: 100vh; width: 440px; max-width: 92vw;
    background: #fffdfb; border-left: 1px solid var(--line); box-shadow: -18px 0 40px rgba(150,110,125,.14);
    transform: translateX(102%); transition: transform .28s cubic-bezier(.3,.8,.3,1);
    display: flex; flex-direction: column; z-index: 20;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .drawer-head h2 { font-size: 15px; margin: 0; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 8px 20px 24px; }
  .drawer-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }

  .sec { margin-top: 20px; }
  .sec h3 { font-size: 13px; margin: 0 0 4px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .sec h3 em { font-style: normal; font-size: 11px; color: var(--ink-soft); font-weight: 400; }
  .sec ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .sec li {
    display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 1.55;
    background: #fffafc; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  }
  .sec li .txt { flex: 1; word-break: break-word; }
  .sec li .keys { color: var(--pink-deep); font-size: 11.5px; }
  .sec li button {
    border: 0; background: none; cursor: pointer; color: #c9b3ba; font-size: 15px; line-height: 1;
    padding: 2px 4px; border-radius: 6px;
  }
  .sec li button:hover { color: #d9536f; background: #fdeef2; }
  .add-box { display: flex; gap: 6px; margin-top: 8px; }
  .add-box textarea {
    flex: 1; min-height: 40px; resize: vertical; padding: 8px 10px; font: inherit; font-size: 12.5px;
    border: 1px dashed #e6cfd6; border-radius: 10px; background: #fffdfb; outline: none; color: var(--ink);
  }
  .add-box textarea:focus { border-color: var(--pink); }
  .tip { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; line-height: 1.6; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .stage { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- 左侧：小猪 -->
  <aside class="stage">
    <div class="pig-wrap">
      <svg class="pig" id="pig" viewBox="0 0 240 240" aria-label="拟人化小猪">
        <defs>
          <radialGradient id="skin" cx="42%" cy="34%" r="72%">
            <stop offset="0%" stop-color="#ffd9e3"/>
            <stop offset="62%" stop-color="#f9bfcd"/>
            <stop offset="100%" stop-color="#efa9bb"/>
          </radialGradient>
          <radialGradient id="snoutg" cx="50%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#f9b3c4"/>
            <stop offset="100%" stop-color="#e08ba1"/>
          </radialGradient>
        </defs>

        <!-- 尾巴 -->
        <g id="tail">
          <path d="M170 196 q22 6 16 20 q-6 12 -20 6" fill="none" stroke="#efa9bb" stroke-width="7" stroke-linecap="round"/>
        </g>
        <!-- 身体 -->
        <ellipse cx="120" cy="205" rx="58" ry="38" fill="url(#skin)"/>
        <ellipse cx="120" cy="212" rx="40" ry="26" fill="#ffdbe4" opacity=".65"/>
        <!-- 耳朵 -->
        <path d="M74 66 q-16 -40 22 -30 q16 5 16 26 z" fill="#f2a4b7"/>
        <path d="M166 66 q16 -40 -22 -30 q-16 5 -16 26 z" fill="#f2a4b7"/>
        <path d="M80 62 q-9 -25 13 -19 q10 3 10 16 z" fill="#e07f97" opacity=".55"/>
        <path d="M160 62 q9 -25 -13 -19 q-10 3 -10 16 z" fill="#e07f97" opacity=".55"/>
        <!-- 头 -->
        <circle cx="120" cy="112" r="62" fill="url(#skin)"/>
        <!-- 腮红 -->
        <ellipse cx="76" cy="130" rx="11" ry="6.5" fill="#f08ea6" opacity=".45"/>
        <ellipse cx="164" cy="130" rx="11" ry="6.5" fill="#f08ea6" opacity=".45"/>
        <!-- 眼睛 -->
        <ellipse id="eyeL" cx="97" cy="104" rx="7" ry="9.5" fill="#4a3f43"/>
        <ellipse id="eyeR" cx="143" cy="104" rx="7" ry="9.5" fill="#4a3f43"/>
        <circle cx="99.5" cy="100.5" r="2.6" fill="#fff" opacity=".9"/>
        <circle cx="145.5" cy="100.5" r="2.6" fill="#fff" opacity=".9"/>
        <!-- 猪鼻 -->
        <ellipse cx="120" cy="132" rx="30" ry="22" fill="url(#snoutg)"/>
        <ellipse cx="110" cy="132" rx="4.6" ry="6.4" fill="#a85a71" opacity=".8"/>
        <ellipse cx="130" cy="132" rx="4.6" ry="6.4" fill="#a85a71" opacity=".8"/>
        <!-- 嘴（说话时出现） -->
        <path id="mouth" d="M106 156 q14 12 28 0" fill="none" stroke="#a85a71" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="name">邵珠佳<small>一只拟人化的小猪</small></div>
    <div class="affinity">
      <div class="hearts" id="hearts"></div>
      <div>亲密度 · <span id="affText">第一次说话</span></div>
    </div>
    <div class="mood" id="mood">她在等你开口</div>
  </aside>

  <!-- 右侧：聊天 -->
  <main class="chat">
    <div class="chat-head">
      <h1>和小猪聊天</h1>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="hint">Enter 发送 · Shift+Enter 换行</span>
        <button class="btn ghost" id="btnManage">语录管理</button>
        <button class="btn ghost" id="btnResetChat">清空对话</button>
      </div>
    </div>
    <div class="log" id="log"></div>
    <div class="composer">
      <textarea id="input" placeholder="说点什么…"></textarea>
      <button class="btn" id="btnSend">发送</button>
    </div>
  </main>
</div>

<!-- 抽屉：语录管理 -->
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>语录管理</h2>
    <button class="btn ghost" id="btnCloseDrawer">关闭</button>
  </div>
  <div class="drawer-body">
    <div class="sec">
      <h3>特色回复 <em>随机说，体现她的口气</em></h3>
      <ul id="listSig"></ul>
      <div class="add-box">
        <textarea id="addSig" placeholder="一行一条，比如：&#10;谁让我这么聪明&#10;笑死我了"></textarea>
        <button class="btn ghost" data-add="sig">添加</button>
      </div>
    </div>

    <div class="sec">
      <h3>关键词规则 <em>说到某词就回什么</em></h3>
      <ul id="listRule"></ul>
      <div class="add-box">
        <textarea id="addRule" placeholder="一行一条，格式：关键词1,关键词2 => 回复&#10;例：吃饭,饿 => 你吃了吗，别饿着"></textarea>
        <button class="btn ghost" data-add="rule">添加</button>
      </div>
      <div class="tip">关键词用逗号分隔，只要消息里出现任意一个就会命中；回复用 =&gt; 后面写。</div>
    </div>

    <div class="sec">
      <h3>兜底回复 <em>没命中任何关键词时</em></h3>
      <ul id="listFall"></ul>
      <div class="add-box">
        <textarea id="addFall" placeholder="一行一条"></textarea>
        <button class="btn ghost" data-add="fall">添加</button>
      </div>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn ghost" id="btnExport">导出 JSON</button>
    <button class="btn ghost" id="btnImport">导入 JSON</button>
    <button class="btn ghost" id="btnDefault">恢复默认语料</button>
    <input type="file" id="fileImport" accept=".json,application/json" style="display:none">
  </div>
</aside>

<script>
/* =========================================================
   数据层
   ========================================================= */
const STORE_KEY = 'pig-npc-data-v1';
const LOG_KEY = 'pig-npc-log-v1';
const AFF_KEY = 'pig-npc-aff-v1';

/* 语料：从 2026-11-14 ~ 11-16 与邵珠佳（Whisper）的聊天记录里提炼，尽量保留原话 */
const DEFAULT_DATA = {
  npcName: '邵珠佳',
  // 招牌口头禅 / 短句 —— 没命中关键词时主要从这里抽，是她的主要气质来源
  signatures: [
    '哈哈哈',
    '哈哈哈哈哈',
    '笑死我了',
    '笑死了',
    '我的天',
    '我的天呐',
    '哎呀，我的妈呀',
    '我去',
    '窝趣',
    '我真是服了',
    '……',
    '噢',
    '噢~',
    '呵呵',
    '反弹。',
    '谢谢谢谢',
    '对对对，没错，没错',
    '你猜我是傻子吗？',
    '谁让我这么聪明',
    '谢谢，我一直都很聪明',
    '你！！！',
    '哦哦哦，没看到',
    '那行，那我记住了',
    '你可以闭嘴了',
    '谁跟你一样',
    '我大度',
    '瞎说',
    '起开',
    '嘿嘿'
  ],
  // 关键词 -> 她在这种话题下的典型说法
  rules: [
    { keys: ['吃', '饭', '饿', '外卖', '食堂'], say: ['刚才去拿了快递，然后买了饭', '因为下午的时候不饿[坏笑]', '噢，那我还是点个外卖吧'] },
    { keys: ['笑', '哈哈', '好笑', '离谱'], say: ['笑死我了', '哈哈哈哈，笑死我了', '你居然能找出这理由来'] },
    { keys: ['聪明', '厉害', '牛逼', '牛', '佩服', '福尔摩斯'], say: ['谁让我这么聪明', '谢谢，我一直都很聪明', '谢谢，我就是当代福尔摩斯', '这个世界上怎么会有我这么聪明的团支书'] },
    { keys: ['谢谢', '谢', '感谢', '麻烦你'], say: ['谢谢谢谢', '你是不是该谢谢我？', '噢，我还得谢谢你呗'] },
    { keys: ['好看', '漂亮', '人美', '夸', '帅'], say: ['我这么人美心善', '你还挺有自知之明', '谢谢谢谢'] },
    { keys: ['班长', '团支书', '查课', '学管会', '通报'], say: ['我班长肯定知道', '他是学管会秘书部的', '感觉我班长也不是很中用了，他不是每次查课都知道', '我真是服了'] },
    { keys: ['阴阳', '怼', '损', '内涵', '锐评'], say: ['对，对对，就这样阴阳他', '我说话从来不搞抽象OK？', '我哪里锐评了？陈述事实也不行？'] },
    { keys: ['烦', '生气', '讨厌', '气死', '无语', '服了'], say: ['我真是服了', '气死了', '马上都快踹他了', '我真是服了'] },
    { keys: ['学习', '知识', '上课', '地理', '物化生', '作业'], say: ['进修的都是一些无用的知识', '我高中没学地理！！！', '你以为我能学的明白？', '这种是天赋你知道吧'] },
    { keys: ['不懂', '不知道', '猜', '啥意思', '什么意思'], say: ['你猜我是傻子吗？', '我允许你再猜一次', '你希望得到的答案是什么', '想不出来'] },
    { keys: ['笨蛋', '傻', '骂', '反弹'], say: ['反弹。', '你猜我是傻子吗？', '呵呵'] },
    { keys: ['病', '感冒', '发烧', '难受', '疼', '药'], say: ['是不是末世要来了所以提前给我的惩罚', '一个坚强的女人……后面不记得了', '噢，不用，我现在已经不烧了，我就单纯有点难受'] },
    { keys: ['睡', '困', '起床', '早起', '早八', '熬夜'], say: ['我最大的限度就是9点起床了', '我按时睡觉，按时起床，要过健康生活', '再早起不来了', '窝趣，发完再睡也行'] },
    { keys: ['地铁', '德州', '市长', '特朗普', '城市'], say: ['建议推举我当德州市长', '比起德州市长，我更想取代特朗普', '我爸妈都不支持我', '我比较爱国'] },
    { keys: ['家', '爸妈', '奶奶', '姐姐', '家人'], say: ['我家没我得散', '要是我不在家的话，他们一天都说不过10句话', '我的作用还是非常之大的'] },
    { keys: ['抖音', '视频', '朋友圈', '表情包'], say: ['这边建议你有空的时候看一下我朋友圈[大哭]', '为什么我感觉你在内涵我的抖音名'] },
    { keys: ['撤回', '发错'], say: ['快快快，撤回'] },
    { keys: ['社团', '射箭', '活动', '学分'], say: ['等我穿越回古代我就有一技之长了', '我感觉射箭老酷了', '好像还没有嘞'] },
    { keys: ['好吧', '行吧', '那行', '可以'], say: ['那行，那我记住了', '行吧，我忘记比较傻的是猜不出来的了', '噢'] }
  ],
  // 兜底：完全没头绪时用
  fallback: [
    '……',
    '噢',
    '呵呵',
    '哈哈哈',
    '想不出来',
    '我真是服了'
  ]
};

let data = loadData();
let log = loadJSON(LOG_KEY, []);
let affinity = loadJSON(AFF_KEY, { count: 0 });

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function loadData() {
  const d = loadJSON(STORE_KEY, null);
  if (!d || !Array.isArray(d.signatures)) return JSON.parse(JSON.stringify(DEFAULT_DATA));
  // 补齐字段，避免旧数据缺项
  d.rules = Array.isArray(d.rules) ? d.rules : [];
  d.fallback = Array.isArray(d.fallback) ? d.fallback : [];
  return d;
}
function saveData() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
function saveLog() { localStorage.setItem(LOG_KEY, JSON.stringify(log.slice(-300))); }
function saveAff() { localStorage.setItem(AFF_KEY, JSON.stringify(affinity)); }

/* =========================================================
   回复引擎
   ========================================================= */
const recent = [];   // 最近用过的回复，避免连着重复

function pickFromPool(pool) {
  if (!pool || !pool.length) return '……';
  const fresh = pool.filter(x => !recent.includes(x));
  const src = fresh.length ? fresh : pool;
  const pick = src[Math.floor(Math.random() * src.length)];
  recent.push(pick);
  if (recent.length > 4) recent.shift();
  return pick;
}

function pickReply(text) {
  const t = (text || '').toLowerCase();
  const hits = [];
  for (const r of data.rules) {
    let score = 0;
    for (const k of r.keys) {
      if (k && t.includes(String(k).toLowerCase())) score += String(k).length;
    }
    if (score > 0) hits.push({ r, score });
  }
  if (hits.length) {
    hits.sort((a, b) => b.score - a.score);
    const best = hits[0].score;
    const tops = hits.filter(h => h.score === best);
    const chosen = tops[Math.floor(Math.random() * tops.length)].r;
    return pickFromPool(chosen.say);
  }
  // 没命中关键词：大多用她的特色口气，偶尔走兜底
  return pickFromPool(Math.random() < 0.7 ? data.signatures : data.fallback);
}

/* =========================================================
   界面
   ========================================================= */
const logEl = document.getElementById('log');
const inputEl = document.getElementById('input');
const pigEl = document.getElementById('pig');
const moodEl = document.getElementById('mood');
const heartsEl = document.getElementById('hearts');
const affTextEl = document.getElementById('affText');

const LEVELS = [
  { at: 0, name: '第一次说话', hearts: 1 },
  { at: 3, name: '有点眼熟', hearts: 2 },
  { at: 8, name: '还算聊得来', hearts: 3 },
  { at: 16, name: '挺熟的', hearts: 4 },
  { at: 30, name: '老熟人了', hearts: 5 }
];
const MOODS = ['她在等你开口', '嗯，听着呢', '你说得挺有意思', '心情不错', '有点想笑'];

function now() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function addRow(who, text, opts = {}) {
  const row = document.createElement('div');
  row.className = 'row ' + who;

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = who === 'pig' ? '🐷' : '我';

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;

  row.appendChild(av);
  row.appendChild(bub);
  if (opts.time) {
    const t = document.createElement('span');
    t.className = 'time';
    t.textContent = now();
    row.appendChild(t);
  }
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
  return row;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'row pig';
  row.id = 'typingRow';
  row.innerHTML = '<div class="avatar">🐷</div><div class="bubble typing"><i></i><i></i><i></i></div>';
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
  return row;
}

function updateAffinity() {
  let lv = LEVELS[0];
  for (const l of LEVELS) if (affinity.count >= l.at) lv = l;
  affTextEl.textContent = lv.name;
  heartsEl.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span');
    s.textContent = '❤';
    if (i < lv.hearts) s.className = 'on';
    heartsEl.appendChild(s);
  }
}

function setMood(text) { moodEl.textContent = text; }

function renderLog() {
  logEl.innerHTML = '';
  log.forEach(m => addRow(m.who, m.text, { time: true }));
}

/* 用户发消息 */
function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  inputEl.focus();

  log.push({ who: 'me', text, t: Date.now() });
  saveLog();
  addRow('me', text, { time: true });
  setMood(MOODS[Math.floor(Math.random() * MOODS.length)]);

  affinity.count++;
  saveAff();
  updateAffinity();

  const reply = pickReply(text);
  const delay = Math.min(1600, 420 + reply.length * 55);
  const typingRow = showTyping();
  pigEl.classList.add('talking');

  setTimeout(() => {
    typingRow.remove();
    log.push({ who: 'pig', text: reply, t: Date.now() });
    saveLog();
    addRow('pig', reply, { time: true });
    pigEl.classList.remove('talking');
    setMood(MOODS[Math.floor(Math.random() * MOODS.length)]);
  }, delay);
}

/* =========================================================
   语录管理
   ========================================================= */
const drawer = document.getElementById('drawer');

function renderManage() {
  const listSig = document.getElementById('listSig');
  const listRule = document.getElementById('listRule');
  const listFall = document.getElementById('listFall');

  listSig.innerHTML = '';
  data.signatures.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="txt"></span><button title="删除">✕</button>';
    li.querySelector('.txt').textContent = s;
    li.querySelector('button').onclick = () => { data.signatures.splice(i, 1); saveData(); renderManage(); };
    listSig.appendChild(li);
  });

  listRule.innerHTML = '';
  data.rules.forEach((r, i) => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="txt"><span class="keys"></span></span><button title="删除">✕</button>';
    li.querySelector('.keys').textContent = r.keys.join(' / ') + ' → ';
    li.querySelector('.txt').appendChild(document.createTextNode(r.say.join('｜')));
    li.querySelector('button').onclick = () => { data.rules.splice(i, 1); saveData(); renderManage(); };
    listRule.appendChild(li);
  });

  listFall.innerHTML = '';
  data.fallback.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="txt"></span><button title="删除">✕</button>';
    li.querySelector('.txt').textContent = s;
    li.querySelector('button').onclick = () => { data.fallback.splice(i, 1); saveData(); renderManage(); };
    listFall.appendChild(li);
  });
}

function addLines(kind, raw) {
  const lines = raw.split('\n').map(x => x.trim()).filter(Boolean);
  if (!lines.length) return;
  for (const line of lines) {
    if (kind === 'rule') {
      const parts = line.split('=>');
      if (parts.length < 2) continue;
      const keys = parts[0].split(/[,，、\/]/).map(x => x.trim()).filter(Boolean);
      const says = parts[1].split(/[|｜]/).map(x => x.trim()).filter(Boolean);
      if (keys.length && says.length) data.rules.push({ keys, say: says });
    } else if (kind === 'sig') {
      data.signatures.push(line);
    } else {
      data.fallback.push(line);
    }
  }
  saveData();
  renderManage();
}

/* =========================================================
   事件绑定
   ========================================================= */
document.getElementById('btnSend').onclick = send;
document.getElementById('btnManage').onclick = () => { renderManage(); drawer.classList.add('open'); };
document.getElementById('btnCloseDrawer').onclick = () => drawer.classList.remove('open');
document.getElementById('btnResetChat').onclick = () => {
  if (!confirm('清空当前对话记录？语录不会被删。')) return;
  log = []; affinity = { count: 0 };
  saveLog(); saveAff(); renderLog(); updateAffinity(); setMood(LEVELS[0].name);
};

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = '46px';
  inputEl.style.height = Math.min(120, inputEl.scrollHeight) + 'px';
});

document.querySelectorAll('[data-add]').forEach(btn => {
  btn.onclick = () => {
    const kind = btn.dataset.add;
    const map = { sig: 'addSig', rule: 'addRule', fall: 'addFall' };
    const ta = document.getElementById(map[kind]);
    addLines(kind, ta.value);
    ta.value = '';
  };
});

document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pig-npc-quotes.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.signatures)) throw new Error('格式不对');
      data = d;
      data.rules = Array.isArray(data.rules) ? data.rules : [];
      data.fallback = Array.isArray(data.fallback) ? data.fallback : [];
      saveData(); renderManage();
      alert('导入成功');
    } catch (err) { alert('导入失败：' + err.message); }
  };
  reader.readAsText(f, 'utf-8');
  e.target.value = '';
};

document.getElementById('btnDefault').onclick = () => {
  if (!confirm('恢复成内置语料？你后来添加的内容会丢。')) return;
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData(); renderManage();
};

/* =========================================================
   启动
   ========================================================= */
renderLog();
updateAffinity();
if (!log.length) {
  addRow('pig', '……你来啦。', { time: true });
  log.push({ who: 'pig', text: '……你来啦。', t: Date.now() });
  saveLog();
}
inputEl.focus();
</script>
</body>
