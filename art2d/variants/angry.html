<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>girl</title>
<style>
  html,body{margin:0;padding:0;background:#FFE9D8;}
  #wrap{width:540px;height:960px;overflow:hidden;position:relative}
  svg{display:block}
  body.girl-only{background:transparent}
  body.girl-only #bg{display:none}
</style>
</head>
<body>
<div id="wrap">
<svg width="540" height="960" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFAEC"/><stop offset="0.5" stop-color="#FFF2D2"/><stop offset="1" stop-color="#FFE4AC"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF0A8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFE793" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFE793" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 头发：三档明暗，靠梯度做出“一绺一绺”的体积 -->
    <linearGradient id="hairFront" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F0D6B2"/><stop offset="0.35" stop-color="#DDB589"/><stop offset="0.7" stop-color="#C4976C"/><stop offset="1" stop-color="#AC7F57"/>
    </linearGradient>
    <linearGradient id="hairMid" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#D9B183"/><stop offset="0.5" stop-color="#C0946A"/><stop offset="1" stop-color="#9E724A"/>
    </linearGradient>
    <linearGradient id="hairDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B98C61"/><stop offset="1" stop-color="#8E6440"/>
    </linearGradient>
    <linearGradient id="hairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFA778"/><stop offset="0.55" stop-color="#B48A60"/><stop offset="1" stop-color="#916744"/>
    </linearGradient>

    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1E7"/><stop offset="0.6" stop-color="#FDE2D1"/><stop offset="1" stop-color="#F8CDB4"/>
    </linearGradient>
    <linearGradient id="tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEBA4"/><stop offset="0.6" stop-color="#FFDE7E"/><stop offset="1" stop-color="#FFD062"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#DCEEFC"/><stop offset="0.45" stop-color="#B3D5F0"/><stop offset="1" stop-color="#8CB6DC"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#C8925F"/><stop offset="0.3" stop-color="#9A6438"/><stop offset="0.75" stop-color="#5E3720"/><stop offset="1" stop-color="#37200F"/>
    </radialGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF9C9C" stop-opacity="0.55"/><stop offset="1" stop-color="#FF9C9C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <g id="bg">
    <rect width="540" height="960" fill="url(#wall)"/>
    <circle cx="450" cy="150" r="120" fill="url(#sunGlow)"/>
    <circle cx="450" cy="150" r="46" fill="#FFE68A"/>
    <g stroke="#FFDD74" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <path d="M450 86 v-16"/><path d="M450 214 v16"/><path d="M386 150 h-16"/><path d="M514 150 h16"/>
      <path d="M405 105 l-11 -11"/><path d="M495 195 l11 11"/><path d="M495 105 l11 -11"/><path d="M405 195 l-11 11"/>
    </g>
    <g fill="url(#bokeh)">
      <circle cx="76" cy="128" r="26"/><circle cx="148" cy="222" r="16"/><circle cx="54" cy="336" r="22"/>
      <circle cx="116" cy="470" r="14"/><circle cx="474" cy="366" r="20"/><circle cx="512" cy="478" r="14"/>
      <circle cx="58" cy="648" r="18"/><circle cx="496" cy="628" r="22"/><circle cx="186" cy="96" r="12"/>
      <circle cx="388" cy="68" r="14"/><circle cx="306" cy="150" r="10"/>
    </g>
  </g>

  <!-- character -->
  <g id="girl">
    <!-- back hair：外层大轮廓，带波浪 -->
    <path d="M270 104
             C186 104 142 166 136 254
             C132 316 118 360 112 430
             C104 514 112 578 104 656
             C96 740 108 848 112 960
             L428 960
             C432 848 444 740 436 656
             C428 578 436 514 428 430
             C422 360 408 316 404 254
             C398 166 354 104 270 104 Z" fill="url(#hairBack)"/>

    <!-- 后层发绺：左右各两绺，靠色差分层 -->
    <path d="M150 300 C126 380 122 470 134 560 C142 620 134 700 120 780 C112 826 122 850 140 838
             C168 760 182 660 178 590 C174 500 172 400 182 320 Z" fill="url(#hairMid)"/>
    <path d="M390 300 C414 380 418 470 406 560 C398 620 406 700 420 780 C428 826 418 850 400 838
             C372 760 358 660 362 590 C366 500 368 400 358 320 Z" fill="url(#hairMid)"/>
    <path d="M170 360 C152 440 152 520 164 596 C172 646 166 700 156 750 C150 782 158 796 170 786
             C188 720 196 646 192 590 C188 512 190 424 198 366 Z" fill="url(#hairDark)" opacity="0.55"/>

             C352 720 344 646 348 590 C352 512 350 424 342 366 Z" fill="url(#hairDark)" opacity="0.45"/>

    <!-- neck：短一点、粗一点 -->
    <path d="M243 452 h54 v72 c0 13 -54 13 -54 0 z" fill="#F8CBB3"/>
    <path d="M243 470 h54 v50 c-16 11 -38 11 -54 0 z" fill="#E5AF94" opacity="0.42"/>

    <!-- torso：宽肩 T 恤 -->
    <path d="M270 512
             C220 512 178 534 156 576
             C138 610 126 676 120 748
             C116 812 116 900 116 960
             L424 960
             C424 900 424 812 420 748
             C414 676 402 610 384 576
             C362 534 320 512 270 512 Z" fill="url(#tee)"/>
    <path d="M156 576 C138 610 126 676 120 748 C116 812 116 900 116 960 L166 960 L170 748
             C174 684 182 626 196 592 Z" fill="#F5C24A" opacity="0.45"/>
    <path d="M384 576 C402 610 414 676 420 748 L424 960 L374 960 L370 748
             C366 684 358 626 344 592 Z" fill="#F5C24A" opacity="0.32"/>
    <path d="M214 640 C226 700 232 800 230 906" fill="none" stroke="#F0B93F" stroke-width="3" opacity="0.45"/>
    <path d="M326 640 C314 700 308 800 310 906" fill="none" stroke="#F0B93F" stroke-width="3" opacity="0.35"/>
    <path d="M262 596 C266 660 266 740 262 820" fill="none" stroke="#FFF0BC" stroke-width="3" opacity="0.5"/>

    <!-- 领口罗纹，压在围巾下面 -->
    <path d="M232 536 C238 566 302 566 308 536 C312 556 300 576 270 576 C240 576 228 556 232 536 Z"
          fill="#FFEEC0" opacity="0.85"/>
    <path d="M232 536 C238 566 302 566 308 536" fill="none" stroke="#EFB93F" stroke-width="3" opacity="0.5"/>

    <!-- 围巾：贴脖子绕一圈 + 两条自然垂下的带子 -->
    <path d="M226 486
             C232 452 250 436 270 436
             C290 436 308 452 314 486
             C322 524 318 556 306 574
             C292 590 248 590 234 574
             C222 556 218 524 226 486 Z" fill="url(#scarf)"/>
    <path d="M226 486 C232 452 250 436 270 436 C290 436 308 452 314 486" fill="none" stroke="#7BA6CD" stroke-width="3.5" opacity="0.45"/>
    <path d="M222 520 C244 546 296 546 318 520" fill="none" stroke="#7BA6CD" stroke-width="3" opacity="0.35"/>
    <path d="M228 552 C248 572 292 572 312 552" fill="none" stroke="#D3E9FA" stroke-width="3" opacity="0.55"/>
    <path d="M234 574 C226 588 222 602 224 616 C236 624 258 626 272 620" fill="url(#scarf)"/>
    <path d="M224 604 C208 668 198 740 196 812 C194 872 200 920 206 960 L256 960
             C250 906 246 840 250 776 C254 720 262 660 268 616 Z" fill="url(#scarf)"/>
    <path d="M224 604 C208 668 198 740 196 812 C194 872 200 920 206 960 L226 960
             C224 892 228 806 236 728 Z" fill="#7BA6CD" opacity="0.28"/>
    <path d="M240 620 C234 700 230 790 232 880" fill="none" stroke="#D3E9FA" stroke-width="3" opacity="0.55"/>
    <path d="M300 600 C312 664 320 736 322 808 C324 868 320 918 316 960 L366 960
             C370 906 370 840 364 776 C358 720 348 656 340 606 Z" fill="url(#scarf)"/>
    <path d="M300 600 C312 664 320 736 322 808 C324 868 320 918 316 960 L336 960
             C338 892 334 806 326 728 Z" fill="#7BA6CD" opacity="0.22"/>
    <path d="M332 620 C338 700 342 790 340 880" fill="none" stroke="#D3E9FA" stroke-width="3" opacity="0.45"/>

    <!-- face：加宽、脸颊更饱满 -->
    <path d="M270 196
             C202 196 166 244 166 316
             C166 372 182 420 208 450
             C232 476 254 490 270 490
             C286 490 308 476 332 450
             C358 420 374 372 374 316
             C374 244 338 196 270 196 Z" fill="url(#skin)"/>
    <ellipse cx="166" cy="342" rx="13" ry="21" fill="#FAD3BC"/>
    <ellipse cx="374" cy="342" rx="13" ry="21" fill="#FAD3BC"/>
    <ellipse cx="270" cy="488" rx="46" ry="9" fill="#E8AE96" opacity="0.12"/>
    <ellipse cx="202" cy="418" rx="34" ry="26" fill="#FFC9B4" opacity="0.35"/>
    <ellipse cx="338" cy="418" rx="34" ry="26" fill="#FFC9B4" opacity="0.3"/>

    <!-- bangs：分缝 + 尖发，盖住额头 -->
    <path d="M164 330
             C152 240 190 172 244 158
             C288 148 328 166 352 198
             C378 232 382 274 370 306
             C358 274 344 266 326 268
             C304 270 290 282 268 286
             C242 290 192 288 164 330 Z" fill="url(#hairFront)"/>
    <path d="M244 158 C222 196 212 240 216 278 C222 258 236 244 252 226 C266 210 274 184 272 164 Z"
          fill="url(#hairDark)" opacity="0.45"/>
    <path d="M300 162 C320 200 328 240 322 278 C316 258 304 248 288 232 C274 218 268 190 270 166 Z"
          fill="url(#hairDark)" opacity="0.35"/>
    <path d="M164 330 C160 300 172 274 190 258 C186 286 186 310 192 330 Z" fill="url(#hairMid)" opacity="0.6"/>
    <path d="M370 324 C376 296 366 268 348 252 C352 282 352 306 346 326 Z" fill="url(#hairMid)" opacity="0.5"/>

    <!-- 前侧发绺：从太阳穴落到胸口 -->
    <path d="M166 318
             C146 392 142 470 152 552
             C158 604 150 650 142 692
             C140 706 152 712 160 700
             C174 622 180 556 182 492
             C184 414 190 348 200 322 Z" fill="url(#hairFront)"/>
    <path d="M374 318
             C394 392 398 470 388 552
             C382 604 390 650 398 692
             C400 706 388 712 380 700
             C366 622 360 556 358 492
             C356 414 350 348 340 322 Z" fill="url(#hairFront)"/>
    <path d="M156 372 C146 452 142 528 146 596" fill="none" stroke="#F7E3C4" stroke-width="6" opacity="0.55" stroke-linecap="round"/>
    <path d="M384 372 C394 452 398 528 394 596" fill="none" stroke="#F7E3C4" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
    <path d="M178 330 C170 400 168 470 174 540" fill="none" stroke="#C0956A" stroke-width="4" opacity="0.35" stroke-linecap="round"/>
    <path d="M362 330 C370 400 372 470 366 540" fill="none" stroke="#C0956A" stroke-width="4" opacity="0.3" stroke-linecap="round"/>

    <!-- 头顶发丝高光 -->
    <g fill="none" stroke-linecap="round">
      <path d="M204 212 C186 258 180 312 186 368" stroke="#F7E3C4" stroke-width="6" opacity="0.5"/>
      <path d="M336 214 C352 260 358 314 352 368" stroke="#F7E3C4" stroke-width="6" opacity="0.4"/>
      <path d="M228 186 C246 168 292 166 314 184" stroke="#FBEBD3" stroke-width="7" opacity="0.45"/>
      <path d="M212 196 C240 174 300 172 330 198" stroke="#B98C61" stroke-width="3" opacity="0.25"/>
    </g>

    <!-- brows: thin, arched -->
    <path d="M192 306 C208 296 238 302 254 322" fill="none" stroke="#8A5E42" stroke-width="7" stroke-linecap="round"/>
    <path d="M348 306 C332 296 302 302 286 322" fill="none" stroke="#8A5E42" stroke-width="7" stroke-linecap="round"/>
    <!-- eyes：更大、上眼睑压住虹膜、三点高光 -->
    <g>
      <ellipse cx="216" cy="374" rx="34" ry="38" fill="#FFFFFF"/>
      <ellipse cx="324" cy="374" rx="34" ry="38" fill="#FFFFFF"/>
      <ellipse cx="216" cy="378" rx="30" ry="35" fill="url(#iris)"/>
      <ellipse cx="324" cy="378" rx="30" ry="35" fill="url(#iris)"/>
      <ellipse cx="216" cy="380" rx="14" ry="21" fill="#28150C"/>
      <ellipse cx="324" cy="380" rx="14" ry="21" fill="#28150C"/>
      <circle cx="203" cy="358" r="12" fill="#FFFFFF"/>
      <circle cx="311" cy="358" r="12" fill="#FFFFFF"/>
      <circle cx="228" cy="398" r="6" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="336" cy="398" r="6" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="212" cy="352" r="4" fill="#FFFFFF" opacity="0.75"/>
      <circle cx="320" cy="352" r="4" fill="#FFFFFF" opacity="0.75"/>
      <path d="M181 364 C190 328 240 324 252 360" fill="none" stroke="#38200F" stroke-width="10" stroke-linecap="round"/>
      <path d="M359 360 C350 328 300 324 288 364" fill="none" stroke="#38200F" stroke-width="10" stroke-linecap="round"/>
      <path d="M181 364 C172 372 170 380 173 388" fill="none" stroke="#38200F" stroke-width="7" stroke-linecap="round"/>
      <path d="M359 360 C368 368 370 376 367 384" fill="none" stroke="#38200F" stroke-width="7" stroke-linecap="round"/>
      <path d="M190 404 C204 416 232 416 244 404" fill="none" stroke="#9A6A50" stroke-width="3" opacity="0.5"/>
      <path d="M350 404 C336 416 308 416 296 404" fill="none" stroke="#9A6A50" stroke-width="3" opacity="0.5"/>
      <path d="M194 340 C210 330 234 330 248 338" fill="none" stroke="#D79C82" stroke-width="3" opacity="0.35"/>
      <path d="M346 338 C330 330 306 330 292 338" fill="none" stroke="#D79C82" stroke-width="3" opacity="0.35"/>
    </g>

    <!-- blush -->
    <ellipse cx="200" cy="428" rx="30" ry="15" fill="url(#blush)"/>
    <ellipse cx="340" cy="428" rx="30" ry="15" fill="url(#blush)"/>

    <!-- nose -->
    <path d="M270 424 c-3 5 -3 8 0 10" fill="none" stroke="#DFA28B" stroke-width="3" stroke-linecap="round"/>

    <!-- mouth: soft smile with a hint of lower lip -->
    <path d="M252 456 C261 460 279 460 288 456" fill="none" stroke="#C25A54" stroke-width="5" stroke-linecap="round"/>
    <!-- hair clip -->
    <g transform="translate(348 240) rotate(20)">
      <path d="M0 -13 L4.4 -4.4 L13 -3.3 L6.5 3.3 L8.7 12 L0 7.6 L-8.7 12 L-6.5 3.3 L-13 -3.3 L-4.4 -4.4 Z" fill="#F8B368"/>
    </g>
  </g>
</svg>
</div>
</body>
</html>
