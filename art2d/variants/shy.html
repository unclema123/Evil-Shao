<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>girl</title>
<style>
  html,body{margin:0;padding:0;background:#FFE9D8;}
  #wrap{width:540px;height:960px;overflow:hidden;position:relative}
  svg{display:block}
  body.girl-only{background:transparent}
  body.girl-only #bg{display:none}
</style>
</head>
<body>
<div id="wrap">
<svg width="540" height="960" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6EC"/><stop offset="1" stop-color="#FFE1CB"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE6FF"/><stop offset="1" stop-color="#EFFAFF"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5C42"/><stop offset="0.55" stop-color="#6E4430"/><stop offset="1" stop-color="#553224"/>
    </linearGradient>
    <linearGradient id="hairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B4230"/><stop offset="1" stop-color="#48291E"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE8D9"/><stop offset="1" stop-color="#FFD8C4"/>
    </linearGradient>
    <linearGradient id="knit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF1E4"/><stop offset="1" stop-color="#EED7C0"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#A9724E"/><stop offset="0.55" stop-color="#7A4A31"/><stop offset="1" stop-color="#41251A"/>
    </radialGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF9AA6" stop-opacity="0.55"/><stop offset="1" stop-color="#FF9AA6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7B8" stop-opacity="0.55"/><stop offset="1" stop-color="#FFE7B8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <g id="bg">
    <rect width="540" height="960" fill="url(#wall)"/>
    <ellipse cx="470" cy="300" rx="260" ry="320" fill="url(#lamp)"/>
    <rect y="690" width="540" height="270" fill="#E9C7A7"/>
    <rect y="690" width="540" height="8" fill="#FFFFFF" opacity="0.35"/>
    <ellipse cx="270" cy="860" rx="240" ry="72" fill="#F6D6CE"/>

    <!-- window -->
    <g>
      <rect x="34" y="92" width="196" height="240" rx="16" fill="#F2D3B7"/>
      <rect x="44" y="102" width="176" height="220" rx="10" fill="url(#sky)"/>
      <circle cx="186" cy="146" r="22" fill="#FFE6A6"/>
      <circle cx="186" cy="146" r="34" fill="#FFE6A6" opacity="0.25"/>
      <g fill="#FFFFFF" opacity="0.9">
        <ellipse cx="86" cy="168" rx="26" ry="14"/><ellipse cx="112" cy="162" rx="20" ry="12"/>
        <ellipse cx="120" cy="222" rx="22" ry="11"/><ellipse cx="142" cy="217" rx="16" ry="9"/>

      <rect x="44" y="208" width="176" height="6" fill="#F7E1CB"/>
      <path d="M30 78 q44 12 40 66 q-6 78 6 200 q-40 -10 -52 -6 z" fill="#F8C6C3"/>

    <g>
      <rect x="352" y="230" width="160" height="10" rx="5" fill="#EFCFB0"/>

        <rect x="366" y="184" width="16" height="46" rx="3" fill="#E79AA6"/>
        <rect x="386" y="176" width="14" height="54" rx="3" fill="#9CC7B6"/>

        <rect x="443" y="192" width="17" height="38" rx="3" fill="#E8A98F"/>

      <ellipse cx="452" cy="308" rx="18" ry="11" fill="#A8CDA2"/>
      <rect x="448" y="318" width="44" height="14" rx="6" fill="#E0A98C"/>
    </g>

    <!-- plant right -->
    <g>
      <g fill="#9CC7A4">
        <ellipse cx="492" cy="640" rx="26" ry="14" transform="rotate(-25 492 640)"/>
        <ellipse cx="472" cy="618" rx="24" ry="13" transform="rotate(-55 472 618)"/>
        <ellipse cx="506" cy="606" rx="22" ry="12" transform="rotate(20 506 606)"/>
        <ellipse cx="486" cy="590" rx="20" ry="11" transform="rotate(-75 486 590)"/>
      </g>
      <path d="M470 660 h44 l-6 46 h-32 z" fill="#E0A98C"/>
      <path d="M470 660 h44 l-3 12 h-38 z" fill="#D1947A"/>
    </g>

    <!-- string lights -->
    <g>
      <path d="M0 46 Q140 92 270 60 T540 78" fill="none" stroke="#C99B7C" stroke-width="3" opacity="0.75"/>
      <g>
        <circle cx="52" cy="66" r="6" fill="#FFE2A8"/><circle cx="52" cy="66" r="12" fill="#FFE2A8" opacity="0.35"/>
        <circle cx="132" cy="79" r="6" fill="#FFE2A8"/><circle cx="132" cy="79" r="12" fill="#FFE2A8" opacity="0.35"/>

        <circle cx="300" cy="60" r="6" fill="#FFE2A8"/><circle cx="300" cy="60" r="12" fill="#FFE2A8" opacity="0.35"/>
        <circle cx="386" cy="62" r="6" fill="#FFE2A8"/><circle cx="386" cy="62" r="12" fill="#FFE2A8" opacity="0.35"/>

    <path d="M247 448 h46 v40 c-14 12 -32 12 -46 0 z" fill="#E8B49C" opacity="0.45"/>

    <path d="M270 490 C230 490 198 508 186 542 C176 570 172 630 176 700 C180 780 186 870 188 960

    <!-- torso shading -->
    <path d="M186 542 C176 570 172 630 176 700 C180 780 186 870 188 960 L206 960 L204 700 C200 634 204 576 214 550 Z" fill="#E7CFB7" opacity="0.55"/>
    <path d="M354 542 C364 570 368 630 364 700 C360 780 354 870 352 960 L334 960 L336 700 C340 634 336 576 326 550 Z" fill="#E7CFB7" opacity="0.55"/>

    <path d="M354 712 C350 730 334 738 314 730" fill="none" stroke="#E2C8AF" stroke-width="4" opacity="0.8"/>

    <path d="M196 570 C184 626 180 682 184 720" fill="none" stroke="#E0C6AD" stroke-width="3" opacity="0.6"/>

      <path d="M280 644 c-8 -12 8 -18 0 -30" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.5" stroke-linecap="round"/>

    <path d="M300 708 q10 6 20 2" fill="none" stroke="#EFB69E" stroke-width="3" opacity="0.75"/>

    <path d="M232 488 C240 530 300 530 308 488 C298 478 284 474 270 474 C256 474 242 478 232 488 Z" fill="#FAEDDC"/>
    <path d="M236 494 C246 524 294 524 304 494" fill="none" stroke="#E6CDB3" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(270 452) scale(0.86) translate(-270 -452)">

    <path d="M270 186 C214 186 190 226 190 288 C190 342 200 388 222 418 C240 442 256 452 270 452
             C284 452 300 442 318 418 C340 388 350 342 350 288 C350 226 326 186 270 186 Z" fill="url(#skin)"/>
    <ellipse cx="270" cy="450" rx="40" ry="8" fill="#E8AE96" opacity="0.1"/>
    <ellipse cx="192" cy="316" rx="12" ry="18" fill="#FFDCC9"/>
    <ellipse cx="348" cy="316" rx="12" ry="18" fill="#FFDCC9"/>

    <!-- bangs: soft fringe, high in the middle -->

             C336 284 306 272 270 278 C234 284 204 288 186 300 Z" fill="url(#hair)"/>
    <path d="M220 200 C248 180 296 176 322 196" fill="none" stroke="#A9765C" stroke-width="8" stroke-linecap="round" opacity="0.28"/>

    <path d="M356 306 C364 366 362 440 352 500 C350 508 342 508 338 498 C344 440 344 368 338 312 Z" fill="url(#hair)"/>

    <!-- back hair texture + rim light -->
    <g stroke="#7A4C36" stroke-width="4" opacity="0.45" fill="none" stroke-linecap="round">
      <path d="M178 420 C170 480 172 540 180 592"/>
      <path d="M362 420 C370 480 368 540 360 592"/>
    </g>
    <path d="M156 336 C152 424 150 520 164 600" stroke="#B98565" stroke-width="5" opacity="0.35" fill="none" stroke-linecap="round"/>
    <path d="M384 336 C388 424 390 520 376 600" stroke="#B98565" stroke-width="5" opacity="0.22" fill="none" stroke-linecap="round"/>

    <!-- brows: thin, arched -->
    <path d="M212 300 C222 292 242 294 250 302" fill="none" stroke="#6B4433" stroke-width="5" stroke-linecap="round"/>
    <path d="M328 300 C318 292 298 294 290 302" fill="none" stroke="#6B4433" stroke-width="5" stroke-linecap="round"/>
    <!-- eyes -->
    <g transform="translate(270 344) scale(0.94) translate(-270 -344)">
      <ellipse cx="232" cy="344" rx="24" ry="29" fill="#FFFFFF"/>
      <ellipse cx="308" cy="344" rx="24" ry="29" fill="#FFFFFF"/>
      <ellipse cx="232" cy="350" rx="20" ry="23" fill="url(#iris)"/>
      <ellipse cx="308" cy="350" rx="20" ry="23" fill="url(#iris)"/>
      <ellipse cx="232" cy="352" rx="11" ry="14" fill="#2E1A12"/>
      <ellipse cx="308" cy="352" rx="11" ry="14" fill="#2E1A12"/>
      <circle cx="224" cy="340" r="7" fill="#FFFFFF"/>
      <circle cx="300" cy="340" r="7" fill="#FFFFFF"/>
      <path d="M208 332 C216 314 248 312 256 330" fill="none" stroke="#3A2418" stroke-width="9" stroke-linecap="round"/>
      <path d="M332 332 C324 314 292 312 284 330" fill="none" stroke="#3A2418" stroke-width="9" stroke-linecap="round"/>
      <path d="M208 332 l-10 -4" stroke="#3A2418" stroke-width="7" stroke-linecap="round"/>
      <path d="M332 332 l10 -4" stroke="#3A2418" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- blush -->
    <ellipse cx="222" cy="392" rx="24" ry="13" fill="url(#blush)"/>
    <ellipse cx="318" cy="392" rx="24" ry="13" fill="url(#blush)"/>

    <!-- nose -->
    <path d="M270 386 c-3 5 -3 8 0 10" fill="none" stroke="#E0A48F" stroke-width="3.5" stroke-linecap="round"/>

    <!-- mouth: soft smile with a hint of lower lip -->
    <path d="M258 412 C263 419 277 419 282 412" fill="none" stroke="#C25A54" stroke-width="5" stroke-linecap="round"/>
    <!-- hair clip -->
    <g transform="translate(330 236) rotate(18)">
      <path d="M0 -12 L4 -4 L12 -3 L6 3 L8 11 L0 7 L-8 11 L-6 3 L-12 -3 L-4 -4 Z" fill="#F2A65A"/>
    </g>
    </g>
  </g>
</svg>
</div>
